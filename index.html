<!      
      <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pinko Store - Connexion</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at top,#35102a 0%,#0b0710 45%,#050507 100%);
    color:white;
}

.login-box{
    width:90%;
    max-width:400px;
    padding:35px 30px;
    background:rgba(20,20,28,.95);
    border:1px solid #ff2775;
    border-radius:20px;
    box-shadow:0 0 35px rgba(255,39,117,.25);
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#ff2775;
    margin-bottom:8px;
}

.subtitle{
    color:#999;
    margin-bottom:30px;
}

.input{
    width:100%;
    padding:15px;
    margin-bottom:15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#0d0d15;
    color:white;
    border:1px solid #292936;
}

.input:focus{
    border-color:#ff2775;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#ff2775;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.btn:hover{
    background:#e91e67;
}

.links{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    font-size:14px;
}

.links a{
    color:#ff2775;
    text-decoration:none;
}

.footer{
    margin-top:25px;
    color:#666;
    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">🔥 PINKO STORE</div>

    <div class="subtitle">
        Bienvenue dans votre boutique
    </div>

    <form onsubmit="login(event)">

        <input
            class="input"
            type="email"
            placeholder="Adresse e-mail"
            required
        >

        <input
            class="input"
            type="password"
            placeholder="Mot de passe"
            required
        >

        <button class="btn" type="submit">
            Se connecter
        </button>

    </form>

    <div class="links">
        <a href="#">Créer un compte</a>
        <a href="#">Mot de passe oublié ?</a>
    </div>

    <div class="footer">
        © 2026 Pinko Store
    </div>

</div>

<script>
function login(event){
    event.preventDefault();

    alert("Connexion de démonstration réussie !");

    window.location.href = "store.html";
}
</script>

</body>
</html>
